         aria-label="${ctaBannerComponent.primaryCTAAriaLabel}"
         data-open-in-new-window="${ctaBannerComponent.isPrimaryCTAOpenInNewWindow}">
        ${ctaBannerComponent.primaryCTALabel}
      </a>
      <sly data-sly-test="${ctaBannerComponent.secondaryCTALabel}">
        <a href="${ctaBannerComponent.secondaryCTALink}"
           aria-label="${ctaBannerComponent.secondaryCTAAriaLabel}"
           data-open-in-new-window="${ctaBannerComponent.isSecondaryCTAOpenInNewWindow}">
          ${ctaBannerComponent.secondaryCTALabel}
        </a>
      </sly>
    </div>
  </div>

</sly>
