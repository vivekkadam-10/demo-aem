<!-- Include CSS -->
<sly data-sly-use.clientLib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientLib.css @ categories='wknd.components.featurescomponent'}" />

<!-- Include JS -->
<sly data-sly-use.clientLib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientLib.js @ categories='wknd.components.featurescomponent'}" />

<sly data-sly-use.featuresComponent="com.divya.demo.core.models.FeaturesComponentModel">

  <!-- Features Component Container -->
  <div class="features-component">
    <sly data-sly-list.tile="${featuresComponent.tiles}">
      <div class="features-component__tile">
        <img src="${tile.backgroundImagePath @ context='html'}" alt="Feature Image" />
        <div class="features-component__tile-content">
          <h2 class="features-component__title">${tile.title @ context='html'}</h2>
          <p class="features-component__description">${tile.description @ context='html'}</p>
          <a href="${tile.ctaLink}" class="features-component__cta">${tile.ctaText @ context='html'}</a>
        </div>
      </div>
    </sly>
  </div>

</sly>
